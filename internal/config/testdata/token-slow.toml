# A token command that outlives the timeout.
[settings]
  partial_prod_after = "90m"

[jira]
  site = "https://example.atlassian.net"
  email = "me@example.com"
  token_command = "sleep 5"
  projects = ["ABC", "XY_2"]

[github]
  author = "me"
  token_command = "echo tok"
  repos = ["acme/app"]

[[aws.accounts]]
  name = "stage-acct"
  profile = "stage"
  region = "us-east-1"

[[envs]]
  account = "stage-acct"
  pipeline = "app-pipeline"
  stage = "Test"
  deploy_action = "Deploy"
